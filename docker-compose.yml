services:
  drip:
    build:
      context: .
      dockerfile: packages/service/Dockerfile
      args:
        DRIP_VERSION: "1.3.2"
        # The CLI binaries served at /dl/ default to this server (read from .env).
        DRIP_BAKED_BASE_URL: "${DRIP_BASE_URL:?set DRIP_BASE_URL in .env}"
    env_file: .env
    ports:
      # Loopback by default; expose with `tailscale serve --bg 8787`, or set
      # DRIP_BIND in .env to the address your reverse proxy reaches.
      - "${DRIP_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - drip-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  drip-data:
